<title>dsh-model-logos — Settings → Models DOM fixture</title>
<!--
  Faithful static reproduction of the DSH "Settings → Models" page, used only by
  scripts/verify-dom.mjs (never shipped).

  Provenance:
  - Page markup + `.jrmgQW_*` CSS: compiled `@deepseek-ai/dsh-client-ui-settings-models`
    (lib/client.js from app.asar; ModelsSection / ProviderEditor / ModelRow /
    add-provider card).
  - Dialog shell markup + `.AnXs9G_*` CSS: compiled
    `@deepseek-ai/dsh-client-ui-settings-general` (SettingsPanel / SettingsRoot).
  - `--dsw-static-*` / `--dsw-alias-*` design tokens: compiled
    `@deepseek-ai/dsh-client-ui-theme` (light theme blocks), copied verbatim so the
    fixture renders like the real dialog instead of an unstyled page.
  - Locale: zh (the strings the shipped page renders with `active: 'zh'`).

  Deliberate simplifications, all visual only:
  - The add-provider card's provider editor keeps the catalog `<select>` and its
    field layout but omits its own model rows, so the model-row assertions have a
    fixed count of three.
  - Inline SVG approximations of the primitive icons (chevron / trash / plus / close).
  - The shell nav lists a representative set of sections plus this plugin's own
    `model-logos` row (rendered with the shell's gear fallback, since the shell only
    knows glyphs for its built-in section ids); the dialog is always open.

  The three saved provider rows are (account-first, as the shipped store sorts them):
    0. DeepSeek 账号 (provider `deepseek-account`; localized `deepSeekAccount` copy,
       not the directory's "DeepSeek Account"; no Edit/Delete buttons because the
       page suppresses Edit for the account route and it is not removable)
    1. anthropic  (official catalog channel; catalog display names equal route ids) + open editor
    2. 火山 Coding Plan (hand-declared, provider id `volcengine`, `declared: true`, user-set display name)
  The add-provider catalog select offers openai / google / moonshotai / xai / openrouter
  (option text equals the catalog display name, i.e. the route id).
-->

          <button type="button" class="AnXs9G_navCell">
            <svg class="AnXs9G_navIcon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M8 2.5l5 2.5v3c0 3-2.1 5.2-5 5.9-2.9-.7-5-2.9-5-5.9v-3z" stroke="currentColor" stroke-width="1.4" fill="none"/></svg>
            <span class="AnXs9G_navLabel">网络搜索</span>
          </button>
          <!--
            The plugin's own section (`id: model-logos`, order 35). The shell's
            `navIcon(id)` switch has no branch for it, so it renders the gear
            fallback — which is what the decorator replaces with the plugin glyph.
          -->
          <button type="button" class="AnXs9G_navCell">
            <svg class="AnXs9G_navIcon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="M8 1.8v2.1M8 12.1v2.1M1.8 8h2.1M12.1 8h2.1M3.6 3.6l1.5 1.5M10.9 10.9l1.5 1.5M12.4 3.6l-1.5 1.5M5.1 10.9l-1.5 1.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none"/></svg>
            <span class="AnXs9G_navLabel">模型图标</span>
          </button>
        </div>
      </nav>
      <div class="AnXs9G_content">
        <div class="AnXs9G_header">
          <div class="AnXs9G_actions"></div>
          <button type="button" class="AnXs9G_close">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <span class="AnXs9G_hiddenLabel">关闭</span>
          </button>
        </div>
        <div class="AnXs9G_options">
          <!-- Models settings section (ModelsSection ready state). -->
          <div class="jrmgQW_section">
            <h2 class="jrmgQW_title">模型</h2>
            <p class="jrmgQW_intro">填入各提供商的 API 密钥即可使用其模型。</p>
            <ul class="jrmgQW_rows">

              <!--
                Saved provider row 0: the signed-in DeepSeek account. The shipped
                page renders its row name with the localized `deepSeekAccount`
                copy ("DeepSeek 账号"), not the directory's "DeepSeek Account";
                its rowActions span is empty because the page suppresses Edit for
                the account route and the route is not removable (settingsPath []).
              -->
              <li class="jrmgQW_rowCard">
                <div class="jrmgQW_rowHead">
                  <span class="jrmgQW_rowIdentity">
                    <span class="jrmgQW_rowName">DeepSeek 账号</span>
                    <span class="jrmgQW_accountStatus">
                      <span class="jrmgQW_credentialDot jrmgQW_credentialDotConfigured" aria-hidden="true"></span>
                      已登录
                    </span>
                  </span>
                  <span class="jrmgQW_rowActions"></span>
                </div>
              </li>

              <!-- Saved provider row 1: official catalog channel (route id shows as its display name), editor expanded. -->
              <li class="jrmgQW_rowCard">
                <div class="jrmgQW_rowHead">
                  <span class="jrmgQW_rowIdentity">
                    <span class="jrmgQW_rowName">anthropic</span>
                    <span class="jrmgQW_credentialDot jrmgQW_credentialDotConfigured" role="img" aria-label="API 密钥已配置" title="API 密钥已配置"></span>
                  </span>
                  <span class="jrmgQW_rowActions">
                    <button type="button" class="jrmgQW_secondaryButton" aria-label="编辑 anthropic">编辑</button>
                    <button type="button" class="jrmgQW_dangerButton" aria-label="删除 anthropic">删除</button>
                  </span>
                </div>
                <!-- ProviderEditor (saved-row editor): header + fields + model catalog + footer. -->
                <div class="jrmgQW_editor">
                  <div class="jrmgQW_editorHeader">
                    <span class="jrmgQW_editorTitle">anthropic</span>
                  </div>
                  <div class="jrmgQW_field">
                    <span class="jrmgQW_fieldLabel">API 密钥</span>
                    <input class="jrmgQW_input" type="password" value="sk-ant-xxxxxxxx" aria-label="API 密钥" placeholder="留空使用已保存凭据">
                  </div>
                  <section class="jrmgQW_modelCatalog" aria-label="模型目录">
                    <div class="jrmgQW_modelListHead">
                      <div class="jrmgQW_modelCatalogHeading">
                        <span class="jrmgQW_modelCatalogTitle">模型目录</span>
                        <span class="jrmgQW_modelCatalogMeta">已自定义模型目录</span>
                      </div>
                      <button type="button" class="jrmgQW_linkButton">获取可用模型</button>
                    </div>
                    <div class="jrmgQW_modelList">

                      <div class="jrmgQW_modelEntry">
                        <div class="jrmgQW_modelRow">
                          <input class="jrmgQW_input" type="text" value="claude-sonnet-4.5" placeholder="模型 ID" aria-label="模型 ID 1">
                          <input class="jrmgQW_input" type="text" value="Claude Sonnet 4.5" placeholder="显示名称" aria-label="显示名称 1">
                          <button type="button" class="jrmgQW_iconButton" aria-label="模型选项 1" aria-expanded="false" title="模型选项">
                            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
                          </button>
                          <button type="button" class="jrmgQW_iconButton jrmgQW_iconButtonDanger" aria-label="删除模型 1" title="删除模型">
                            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3.5 4.5h9M6 4.5V3.2h4v1.3M5 4.5l.5 8.3h5l.5-8.3M6.7 6.6v3.9M9.3 6.6v3.9" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
                          </button>
                        </div>
                      </div>

                      <div class="jrmgQW_modelEntry">
                        <div class="jrmgQW_modelRow">
                          <input class="jrmgQW_input" type="text" value="gpt-5.2" placeholder="模型 ID" aria-label="模型 ID 2">
                          <input class="jrmgQW_input" type="text" value="GPT-5.2" placeholder="显示名称" aria-label="显示名称 2">
                          <button type="button" class="jrmgQW_iconButton" aria-label="模型选项 2" aria-expanded="false" title="模型选项">
                            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
                          </button>
                          <button type="button" class="jrmgQW_iconButton jrmgQW_iconButtonDanger" aria-label="删除模型 2" title="删除模型">
                            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3.5 4.5h9M6 4.5V3.2h4v1.3M5 4.5l.5 8.3h5l.5-8.3M6.7 6.6v3.9M9.3 6.6v3.9" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
                          </button>
                        </div>
                      </div>

                      <div class="jrmgQW_modelEntry">
                        <div class="jrmgQW_modelRow">
                          <input class="jrmgQW_input" type="text" value="my-local-qwen" placeholder="模型 ID" aria-label="模型 ID 3">
                          <input class="jrmgQW_input" type="text" value="本地 Qwen" placeholder="显示名称" aria-label="显示名称 3">
                          <button type="button" class="jrmgQW_iconButton" aria-label="模型选项 3" aria-expanded="false" title="模型选项">
                            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
                          </button>
                          <button type="button" class="jrmgQW_iconButton jrmgQW_iconButtonDanger" aria-label="删除模型 3" title="删除模型">
                            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3.5 4.5h9M6 4.5V3.2h4v1.3M5 4.5l.5 8.3h5l.5-8.3M6.7 6.6v3.9M9.3 6.6v3.9" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
                          </button>
                        </div>
                      </div>

                    </div>
                    <button type="button" class="jrmgQW_addModelButton">
                      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                      添加模型
                    </button>
                  </section>
                  <div class="jrmgQW_editorActions">
                    <button type="button" class="jrmgQW_secondaryButton">取消</button>
                    <button type="button" class="jrmgQW_primaryButton">保存</button>
                  </div>
                </div>
              </li>

              <!-- Saved provider row 2: hand-declared custom provider (no vendor logo). -->
              <li class="jrmgQW_rowCard">
                <div class="jrmgQW_rowHead">
                  <span class="jrmgQW_rowIdentity">
                    <span class="jrmgQW_rowName">火山 Coding Plan</span>
                    <span class="jrmgQW_rowTag">自定义</span>
                    <span class="jrmgQW_credentialDot jrmgQW_credentialDotMissing" role="img" aria-label="API 密钥缺失" title="API 密钥缺失"></span>
                  </span>
                  <span class="jrmgQW_rowActions">
                    <button type="button" class="jrmgQW_secondaryButton" aria-label="编辑 火山 Coding Plan">编辑</button>
                    <button type="button" class="jrmgQW_dangerButton" aria-label="删除 火山 Coding Plan">删除</button>
                  </span>
                </div>
              </li>

            </ul>

            <!-- Add-provider card (catalog mode, always open in the fixture). -->
            <div class="jrmgQW_addBlock">
              <div class="jrmgQW_addCard">
                <div class="jrmgQW_addModes">
                  <div class="jrmgQW_editorHeader">
                    <span class="jrmgQW_editorTitle">第三方模型提供商</span>
                  </div>
                  <p class="jrmgQW_advancedHint">从内置目录中选择 OpenAI、Anthropic、Kimi 等提供商，填入其 API 密钥即可使用。</p>
                </div>
                <div id="model-logos-add-catalog-panel" class="jrmgQW_addPanel">
                  <div class="jrmgQW_field">
                    <span class="jrmgQW_fieldLabel">提供商</span>
                    <select class="jrmgQW_input jrmgQW_selectInput" aria-label="提供商">
                      <option value="openai">openai</option>
                      <option value="google">google</option>
                      <option value="moonshotai">moonshotai</option>
                      <option value="xai">xai</option>
                      <option value="openrouter">openrouter</option>
                    </select>
                  </div>
                  <div class="jrmgQW_field">
                    <span class="jrmgQW_fieldLabel">API 密钥</span>
                    <input class="jrmgQW_input" type="password" aria-label="API 密钥" placeholder="输入 API 密钥">
                  </div>
                  <section class="jrmgQW_modelCatalog" aria-label="模型目录">
                    <div class="jrmgQW_modelListHead">
                      <div class="jrmgQW_modelCatalogHeading">
                        <span class="jrmgQW_modelCatalogTitle">模型目录</span>
                        <span class="jrmgQW_modelCatalogMeta">正在使用适配器默认模型</span>
                      </div>
                    </div>
                    <p class="jrmgQW_modelEmpty">模型选择器中将不显示任何模型；目录外 ID 仍可直接发送。</p>
                  </section>
                  <div class="jrmgQW_editorActions">
                    <button type="button" class="jrmgQW_secondaryButton">取消</button>
                    <button type="button" class="jrmgQW_primaryButton">保存</button>
                  </div>
                </div>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
